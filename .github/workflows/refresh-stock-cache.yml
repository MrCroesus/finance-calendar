name: Refresh Stock Cache

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  refresh-cache:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./finance-calendar-backend  # Set working directory
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Fetch fresh stock data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: node scripts/fetch-stocks.js

      - name: Commit backup file (optional)
        working-directory: .  # Run git commands from repo root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add finance-calendar-backend/data/stock_cache.json
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "chore: auto-update stock cache [skip ci]" && git push)
        continue-on-error: true
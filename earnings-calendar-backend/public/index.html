<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Calendar API</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 80px auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1 { color: #333; }
        code {
            background: #f4f4f4;
            padding: 2px 6px;
            border-radius: 3px;
        }
        .endpoint {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>📅 Finance Calendar API</h1>
    <p>This API generates .ics calendar feeds for stock earnings and economic events.</p>
    
    <div class="endpoint">
        <strong>Calendar Feed:</strong><br>
        <code>GET /api/calendar/[id]</code>
    </div>
    
    <div class="endpoint">
        <strong>Create Calendar:</strong><br>
        <code>POST /api/create-calendar</code>
    </div>
    
    <p>API is running and ready to serve calendar feeds.</p>
</body>
</html>
